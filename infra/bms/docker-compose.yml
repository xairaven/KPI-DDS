# Infrastructure of our BMS: message broker and databases.
# Credentials here are for local development only.
name: bms

services:
  # Message broker between BMS services.
  # AMQP (for services): localhost:5672
  # Management UI: http://localhost:15672  (bms / bms)
  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    # RabbitMQ names its data directory after the hostname.
    # A fixed hostname keeps durable queues across container re-creation.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: bms
      RABBITMQ_DEFAULT_PASS: bms
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One Postgres server, one database (and user) per service.
  # localhost:5432
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<version>/...
      - postgres-data:/var/lib/postgresql
      # Runs once, when the data volume is empty.
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Distributed tracing backend. Services send spans over OTLP/HTTP.
  # UI: http://localhost:16686
  # OTLP: localhost:4318 (for services started with cargo run:
  #   OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318)
  # Traces are kept in memory and lost on restart: enough for development.
  jaeger:
    image: jaegertracing/jaeger:2.23.0
    ports:
      - "16686:16686"
      - "4318:4318"

  # ---------- BMS services ----------
  # Profile "app": a plain "docker compose up" starts only the infrastructure
  # above (for running services with cargo); "--profile app" adds the services.
  # They join the lecturer's network to reach Redis and Communication Control,
  # so start infra/hiveemulator first.

  bms-ingest:
    profiles: [app]
    build: { context: ../.., target: bms-ingest }
    image: bms-ingest:local
    # Exactly one instance: two would publish every bus message twice.
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      CC_URL: http://communication-control:8080
      RABBITMQ_URL: amqp://bms:bms@rabbitmq:5672
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    networks: [default, hiveemulator]
    depends_on:
      rabbitmq: { condition: service_healthy }

  bms-state:
    profiles: [app]
    build: { context: ../.., target: bms-state }
    image: bms-state:local
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://bms_state:bms_state@postgres:5432/state
      RABBITMQ_URL: amqp://bms:bms@rabbitmq:5672
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    # REST API + Swagger: http://localhost:9000/swagger
    ports:
      - "9000:9000"
    depends_on:
      rabbitmq: { condition: service_healthy }
      postgres: { condition: service_healthy }

  bms-deconfliction:
    profiles: [app]
    build: { context: ../.., target: bms-deconfliction }
    image: bms-deconfliction:local
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://bms_deconfliction:bms_deconfliction@postgres:5432/deconfliction
      CC_URL: http://communication-control:8080
      RABBITMQ_URL: amqp://bms:bms@rabbitmq:5672
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    networks: [default, hiveemulator]
    depends_on:
      rabbitmq: { condition: service_healthy }
      postgres: { condition: service_healthy }

networks:
  default:
  # Created by infra/hiveemulator (project "hiveemulator").
  hiveemulator:
    name: hiveemulator_default
    external: true

volumes:
  rabbitmq-data:
  postgres-data:
