[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
authors = ["Oleksandr Kovalov <oleksandr.kovalov.work@gmail.com>"]
publish = false

categories = ["science"]

readme = "README.md"
license = "MIT"
repository = "https://github.com/xairaven/KPI-DDS"

[profile.release]
lto = true
opt-level = 3
panic = "abort"
strip = "symbols"

[workspace.dependencies]
bms-common = { path = "crates/bms-common" }

axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
eframe = "0.37.0"
egui = "0.37.0"
futures-util = "0.3.34"
# 4.13 is only days old; stay on the 4.12 line. No TLS: the broker is on a private network.
# OpenTelemetry: traces exported over OTLP/HTTP (protobuf) by a background thread.
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = [
    "http-proto",
    "reqwest-blocking-client",
    "trace",
] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
lapin = { version = "~4.12.3", default-features = false, features = ["tokio"] }
redis = { version = "1.8", features = ["tokio-comp"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9", default-features = false, features = [
    "chrono",
    "json",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "uuid",
] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34.0", default-features = false }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.3.0"
# Vendored: the Swagger UI files ship inside the crate instead of being downloaded at build time.
utoipa-swagger-ui = { version = "10.0.2", features = ["axum", "vendored"] }
# 0.66 is only days old; stay on 0.65.
walkers = "~0.65.0"
uuid = { version = "1.29.3", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_doc_comments = "allow"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

collapsible_if = "warn"
collapsible_else_if = "warn"
collapsible_match = "warn"
collapsible_str_replace = "warn"
indexing_slicing = "deny"

allow_attributes_without_reason = "warn"
inconsistent_struct_constructor = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
similar_names = "allow"
